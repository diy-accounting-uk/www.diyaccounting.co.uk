[shared."hmrc-welsh-services"]
cy = '''
<h2 id="welshServicesHeading">Gwasanaethau Cymraeg CThEF</h2>
<p>Mae sgriniau a negeseuon ar-lein CThEF ar gael yn Gymraeg. Pan fydd DIY Accounting Submit yn eich anfon i CThEF i fewngofnodi, dewiswch ‘Cymraeg’ ar dudalen CThEF.</p>
<p>Yn DIY Accounting Submit, gallwch weld adborth HMRC Assist ar eich Ffurflen TAW yn Gymraeg.</p>
<p>Llinell gymorth Gymraeg CThEF ar gyfer Treth Incwm, Hunanasesiad, Yswiriant Gwladol a TWE: <a href="tel:+443002001900">0300 200 1900</a>. Ar gyfer TAW, tollau ac ecséis: <a href="tel:+443002003705">0300 200 3705</a>. Mae’r ddwy linell ar agor o ddydd Llun i ddydd Gwener, 8:30am i 5pm, ac ar gau ar wyliau banc.</p>
<p><a href="https://www.gov.uk/government/organisations/hm-revenue-customs/contact/welsh-language-helplines">Llinellau cymorth Cymraeg CThEF ar GOV.UK</a></p>
<p class="welsh-services-note">Cyfieithiad o’n tudalen Saesneg yw’r dudalen hon. Mae’r rhan fwyaf o’n gwefannau eraill yn Saesneg.</p>
'''

