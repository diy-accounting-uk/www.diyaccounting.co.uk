[strings."about.about-heading"]
hash = "7195ccfc9db0"
cy = '''Am DIY Accounting'''

[strings."about.about-1"]
hash = "6d247c97867c"
cy = '''Teulu’r sylfaenydd, Terry Cartwright, sy’n rheoli DIY Accounting Limited. Ers mis Ionawr 2010, y tîm sy’n rhedeg y gwaith o ddydd i ddydd, ac mae’n cadw’r safonau a osododd Terry: meddalwedd sy’n hawdd ei defnyddio a gwasanaeth personol i gwsmeriaid.'''

[strings."about.about-2"]
hash = "bbdc55179d50"
cy = '''Mae’r cwmni’n adnabyddus am daenlenni cyfrifyddu syml a gynlluniwyd gan Gyfrifydd Rheoli Siartredig. Maen nhw’n rhoi i fusnesau bach yr offer sydd eu hangen arnyn nhw, heb gymhlethdod diangen.'''

[strings."about.director-1"]
hash = "da6efee4c0c1"
cy = '''<strong>Antony Cartwright</strong> &mdash; Cyfarwyddwr'''

[strings."about.director-2"]
hash = "344d0136777d"
cy = '''<strong>Jane Grundy</strong> &mdash; Cyfarwyddwr'''

[strings."about.director-3"]
hash = "b5ac297a8bc7"
cy = '''<strong>Samantha Cartwright</strong> &mdash; Cyfarwyddwr'''

[strings."about.about-more"]
hash = "8859ed9118c4"
cy = '''Darllen mwy am DIY Accounting'''

[strings."about.about-more-1"]
hash = "8e48100f20e7"
cy = '''Mae DIY Accounting wedi bod yn adnabyddus erioed am feddalwedd sy’n hawdd ei defnyddio ac am wasanaeth personol i gwsmeriaid. Mae’r tîm presennol yn cynnwys swyddog marchnata a chymorth gwasanaeth cwsmeriaid, ynghyd ag ymgynghorydd marchnata ar-lein a chynorthwyydd cyfrifon sy’n rhoi cymorth technegol.'''

[strings."about.about-more-2"]
hash = "aedccc4afa01"
cy = '''Terry Cartwright ei hun a gynlluniodd yr holl feddalwedd cyfrifyddu a chyflogres. Byddai’n ateb pob cwestiwn gan gwsmeriaid am feddalwedd cyfrifyddu, cadw cyfrifon neu feddalwedd cyflogres ei hun. Nod y tîm nawr yw rhoi’r un gofal ac arbenigedd o safon uchel ag a roddodd Terry, ac rydym yn mesur llwyddiant drwy adborth cwsmeriaid.'''

[strings."about.about-more-3"]
hash = "0d184c15ebcb"
cy = '''Os ydych yn credu y gallwn wella ein cynnyrch neu ein gwasanaeth, rydym yn croesawu awgrymiadau. Rydym wedi ymrwymo i barhau â’r gwaith o ddarparu offer cyfrifyddu hygyrch a dibynadwy i fusnesau bach yn y DU.'''

[strings."about.history-heading"]
hash = "0e7696009337"
cy = '''Hanes'''

[strings."about.history-1"]
hash = "d2305b4ee951"
cy = '''Sefydlwyd DIY Accounting gan Terry Cartwright, Cyfrifydd Rheoli Siartredig (ACMA) ac Ysgrifennydd Cwmni Siartredig (ACIS). Dechreuodd gynllunio systemau cyflogres a chyfrifyddu ar daenlenni Excel yn 2006.'''

[strings."about.history-2"]
hash = "b40843d0fbba"
cy = '''Bu farw Terry ym mis Rhagfyr 2009, ac erbyn hyn ei blant sy’n rheoli’r cwmni: Antony, Jane, Samantha, Lindsey a Daniel.'''

[strings."about.founder-more"]
hash = "68c4c07af981"
cy = '''Darllen mwy am y sylfaenydd'''

[strings."about.founder-1"]
hash = "e750e9c94fe5"
cy = '''Cymhwysodd Terry Cartwright fel Cyfrifydd Rheoli Siartredig (ACMA) yn 1971, ac aeth ymlaen i gynllunio system cyllidebu refeniw ar gyfer British Rail. Bu’n Gyfrifydd Rheoli a Gwaith yn New World Gas Cookers cyn cymhwyso fel Ysgrifennydd Cwmni Siartredig (ACIS).'''

[strings."about.founder-2"]
hash = "1130a7b58134"
cy = '''Yn British Steel, cafodd ei ddyrchafu’n Bennaeth Cyllid a Gweinyddu yn yr adran Refractories. Yn ddiweddarach bu’n gweithio yn Saudi Arabia fel Prif Gyfrifydd i gorfforaeth Americanaidd. Ar ôl dod yn ôl i’r DU, daeth yn Brif Gyfrifydd yn Dunlop Industrial Hose.'''

[strings."about.founder-3"]
hash = "6ee074d8581f"
cy = '''Ar ddechrau’r 1980au, dechreuodd Terry ei gwmni manwerthu a chyfanwerthu ei hun, a thyfodd y cwmni i sawl siop gyda throsiant o bron i &pound;1 miliwn. Ar ddechrau’r 1990au dychwelodd at gyfrifyddiaeth. Bu’n gweithio ar system cyfrifyddu gwerthiant Ewropeaidd, ar osod meddalwedd Oracle, ac ar system rheoli trysorlys i fanc yn y DU, cyn dod yn Gyfarwyddwr Cyllid i gwmni cyfathrebu.'''

[strings."about.founder-4"]
hash = "633442a3846c"
cy = '''Pan hanner ymddeolodd tua 2000, dilynodd Terry ei ddiddordeb mewn adareg, a pharhaodd i gadw cyfrifon ariannol i gwmnïau diwydiannol. Yn 2006 dechreuodd DIY Accounting, a defnyddiodd ddegawdau o brofiad i gynllunio systemau cyflogres a chyfrifyddu ymarferol ar daenlenni Excel. Fel Ysgrifennydd Cwmni Siartredig, bu hefyd yn asiant ffurfio cwmnïau.'''

