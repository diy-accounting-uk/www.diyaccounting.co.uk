[strings."about.about-heading"]
hash = "7195ccfc9db0"
cy = '''About DIY Accounting'''

[strings."about.about-1"]
hash = "6d247c97867c"
cy = '''DIY Accounting Limited is managed by the family of founder Terry Cartwright. Since January 2010, the team has taken over day-to-day operations while maintaining the standards of ease of use and personal customer service that Terry established.'''

[strings."about.about-2"]
hash = "bbdc55179d50"
cy = '''The company is known for straightforward accounting spreadsheets designed by a Chartered Management Accountant, providing small businesses with the tools they need without unnecessary complexity.'''

[strings."about.director-1"]
hash = "da6efee4c0c1"
cy = '''<strong>Antony Cartwright</strong> &mdash; Director'''

[strings."about.director-2"]
hash = "344d0136777d"
cy = '''<strong>Jane Grundy</strong> &mdash; Director'''

[strings."about.director-3"]
hash = "b5ac297a8bc7"
cy = '''<strong>Samantha Cartwright</strong> &mdash; Director'''

[strings."about.about-more"]
hash = "8859ed9118c4"
cy = '''Read more about DIY Accounting'''

[strings."about.about-more-1"]
hash = "8e48100f20e7"
cy = '''DIY Accounting has always been recognised for its ease of use and personal customer service. The current team includes a dedicated marketing executive and customer service support, along with an online marketing consultant and accounts assistant providing technical support.'''

[strings."about.about-more-2"]
hash = "aedccc4afa01"
cy = '''All accounting and payroll software was personally designed by Terry Cartwright. He would answer every customer question about accounting software, bookkeeping, or payroll software himself. The team now aims to provide the same high quality of care and expertise that Terry provided, and success is measured by customer feedback.'''

[strings."about.about-more-3"]
hash = "0d184c15ebcb"
cy = '''If you think we can improve our product or service, we welcome suggestions. We are committed to continuing the legacy of accessible, reliable accounting tools for UK small businesses.'''

[strings."about.history-heading"]
hash = "0e7696009337"
cy = '''History'''

[strings."about.history-1"]
hash = "d2305b4ee951"
cy = '''DIY Accounting was founded by Terry Cartwright, a Chartered Management Accountant (ACMA) and Chartered Company Secretary (ACIS), who began designing payroll and accounting systems on Excel spreadsheets in 2006.'''

[strings."about.history-2"]
hash = "b40843d0fbba"
cy = '''Terry passed away in December 2009 and the company is now managed by his children: Antony, Jane, Samantha, Lindsey, and Daniel.'''

[strings."about.founder-more"]
hash = "68c4c07af981"
cy = '''Read more about the founder'''

[strings."about.founder-1"]
hash = "e750e9c94fe5"
cy = '''Terry Cartwright qualified as a Chartered Management Accountant (ACMA) in 1971 and went on to design a revenue budgeting system for British Rail. He served as Management and Works Accountant at New World Gas Cookers before qualifying as a Chartered Company Secretary (ACIS).'''

[strings."about.founder-2"]
hash = "1130a7b58134"
cy = '''At British Steel he was promoted to Head of Finance and Administration for the Refractories division. He later worked in Saudi Arabia as Chief Accountant for an American corporation, and on returning to the UK became Chief Accountant at Dunlop Industrial Hose.'''

[strings."about.founder-3"]
hash = "6ee074d8581f"
cy = '''In the early 1980s Terry started his own retail and wholesale company, growing it to multiple outlets with turnover approaching &pound;1 million. In the early 1990s he returned to accountancy, working on a European sales accounting system, Oracle software implementations, and a treasury management system for a UK bank, before serving as Finance Director for a communications company.'''

[strings."about.founder-4"]
hash = "633442a3846c"
cy = '''Semi-retiring around 2000, Terry pursued ornithology alongside maintaining financial accounts for industrial companies. In 2006 he started DIY Accounting, applying his decades of experience to designing practical payroll and accounting systems on Excel spreadsheets. As a Chartered Company Secretary he also acted as a company formation agent.'''

